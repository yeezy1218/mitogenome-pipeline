$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
properties:
  sample: {type: string, pattern: "^[A-Za-z0-9_]+$"}
  source: {type: string, enum: [sra, genbank]}
  accession: {type: string, pattern: "^[A-Za-z0-9_.]+$"}
  species: {type: string}
required: [sample, source, accession]
