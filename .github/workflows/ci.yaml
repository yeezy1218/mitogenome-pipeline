name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "snakemake>=8.20,<9" pandas pytest
      - name: Unit tests
        run: pytest -q
      - name: Lint workflow
        run: snakemake --lint --configfile .test/config.yaml
      - name: Dry run (builds the full job graph without running tools)
        run: snakemake -n --configfile .test/config.yaml
